# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Release"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Release
    if: ${{ github.repository == 'andykenward/github-actions' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit, tags and GitHub releases
      pull-requests: write # create/update the Version Packages PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js Pnpm & install dependencies
        uses: ./setup-pnpm
        with:
          node-version: 24.x
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 #v2.1.2
        with:
          publish-script: pnpm release
