# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Release"

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Release
    if: ${{ github.repository == 'andykenward/github-actions' }}
    runs-on: ubuntu-slim
    # Pushes and PRs go through the app token below, so GITHUB_TOKEN only reads.
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js Pnpm & install dependencies
        uses: $/setup-pnpm
      # GitHub doesn't run workflows for PRs and pushes made with GITHUB_TOKEN;
      # an app token lets the Version Packages PR get its checks.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write # push the version commit, tags and GitHub releases
          permission-pull-requests: write # create/update the Version Packages PR
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 #v2.1.2
        with:
          publish-script: pnpm release
          github-token: ${{ steps.app-token.outputs.token }}
