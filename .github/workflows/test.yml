# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# Runs the setup-pnpm action from this commit with each Node-version source and
# with caching on and off.
name: test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-pnpm:
    name: setup-pnpm (${{ matrix.name }})
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
          - name: node-version
            node-version: 24.x
          - name: node-version-file
            node-version-file: package.json
          - name: no cache
            cache: "false"
          # The fixture has no packageManager field, so pnpm-version is required.
          - name: working-directory + pnpm-version
            working-directory: .github/fixtures/subdir
            pnpm-version: 12.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: $/setup-pnpm
        id: setup
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: ${{ matrix.cache || 'true' }}
          pnpm-version: ${{ matrix.pnpm-version }}
          working-directory: ${{ matrix.working-directory || '.' }}
      - name: Check Node major, pnpm, install location and outputs
        shell: bash
        env:
          NODE_VERSION: ${{ steps.setup.outputs.node-version }}
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
          PNPM_VERSION: ${{ matrix.pnpm-version }}
          WORKING_DIRECTORY: ${{ matrix.working-directory || '.' }}
        run: |
          echo "node-version=$NODE_VERSION cache-hit=$CACHE_HIT pnpm=$(pnpm --version)"
          [[ "$(node -p 'process.versions.node.split(".")[0]')" == "24" ]]
          [[ "$NODE_VERSION" == v24.* ]]
          [[ -z "$PNPM_VERSION" || "$(pnpm --version)" == "$PNPM_VERSION" ]]
          [[ -f "$WORKING_DIRECTORY/node_modules/.modules.yaml" ]]
