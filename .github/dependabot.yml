# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2
updates:
  # Maintain dependencies for GitHub Actions (workflows and the composite action)
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/setup-pnpm"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Maintain dependencies for npm. Cooldown matches pnpm's minimumReleaseAge
  # (10080 minutes) in pnpm-workspace.yaml, so PRs never target a version pnpm
  # would refuse to install.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Dev container features in devcontainer.json
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Dev container base image (tag + digest) in .devcontainer/Dockerfile
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
