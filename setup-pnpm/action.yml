# yaml-language-server: $schema=https://json.schemastore.org/github-action.json

name: "Setup Node, pnpm, cache & install"
description: "Sets up Node and pnpm, caches the pnpm store keyed on the lockfile, then runs a frozen-lockfile install"
branding:
  icon: package
  color: orange
inputs:
  node-version:
    description: "Version of Node. Defaults to 24.x unless node-version-file is set."
    required: false
    default: ""
  node-version-file:
    description: "File to read the Node version from (e.g. .nvmrc, .node-version, package.json), relative to working-directory"
    required: false
    default: ""
  pnpm-version:
    description: "Version of pnpm, for projects without a packageManager field in package.json. pnpm/action-setup fails if both are set and differ."
    required: false
    default: ""
  cache:
    description: "Cache the pnpm store. Set to false in release or publish jobs to rule out cache poisoning."
    required: false
    default: "true"
  working-directory:
    description: "Directory containing package.json and pnpm-lock.yaml, relative to the repository root"
    required: false
    default: "."
outputs:
  cache-hit:
    description: "Whether the pnpm store was restored from the cache"
    value: ${{ steps.setup-node.outputs.cache-hit }}
  node-version:
    description: "The installed Node version"
    value: ${{ steps.setup-node.outputs.node-version }}
runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 #v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}
        package_json_file: ${{ inputs.working-directory }}/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
      id: setup-node
      with:
        # node-version wins over node-version-file in setup-node, so only
        # fall back to 24.x when neither is given.
        node-version: ${{ inputs.node-version || (inputs.node-version-file == '' && '24.x' || '') }}
        node-version-file: ${{ inputs.node-version-file && format('{0}/{1}', inputs.working-directory, inputs.node-version-file) || '' }}
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
    # Inputs reach this step only through working-directory, never the script.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
